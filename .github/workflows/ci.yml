name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      # The shared conformance fixtures. `fancy-conformance` is in the `test`
      # dependency group and is NOT on PyPI, so `pip install --group dev` alone
      # cannot resolve it -- this workflow failed at Install on every run from
      # its first, on 2026-08-19, with "No matching distribution found for
      # fancy-conformance". Checked out, NOT skipped when absent: a conformance
      # suite that silently does not run reads exactly like full coverage.
      #
      # At the TAG the suite pins (PINNED_SUITE_VERSION in
      # tests/test_conformance.py), never `main`. The pin is the contract: moving
      # it is a deliberate commit here, never a side effect of someone else's
      # release. With no `ref`, every fixture release turned this build red for a
      # reason no commit in this repository caused, and it sat red for weeks. A
      # test fails if this ref and the pin disagree.
      - name: Check out fancy-conformance
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.22.0
          path: .conformance
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The checkout FIRST: once it is installed, the group's
          # `fancy-conformance` requirement is already satisfied and pip never
          # asks PyPI for a package that is not there. The group stays the one
          # list of what the suite needs.
          python -m pip install -e ./.conformance/python
          python -m pip install -e . --group dev

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy

      # pyproject's `pythonpath` names ../fancy-conformance/python/src, which is
      # where the loader sits in the .agi envelope and does not exist here. The
      # editable install above supplies the loader; the root is set explicitly
      # so the fixtures read are the checkout this job made, not a guess.
      - name: Test
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.conformance
        run: pytest -ra

      # The suite runs on a bare checkout via `pythonpath = ["src"]`, which is
      # convenient and does NOT prove the distribution is complete. Only running
      # against a built wheel catches an unshipped file or a missing `py.typed`,
      # and both of those pass locally and break for every user.
      - name: Test the built wheel
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.conformance
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fancy_features, pathlib; \
            assert (pathlib.Path(fancy_features.__file__).parent / 'py.typed').is_file(), \
            'py.typed did not ship'"
          pytest -ra -p no:cacheprovider --override-ini="pythonpath="
