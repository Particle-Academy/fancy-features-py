name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Build and publish are separate jobs so `id-token: write` is never held by
  # the job that executes build code.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The one documentation failure that cannot be repaired later: once the
      # sdist is on PyPI, whoever upgraded into it has no way to learn what
      # changed. Checked before anything is built.
      - name: Require a CHANGELOG entry for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${version}\]" CHANGELOG.md || {
            echo "::error::No CHANGELOG.md entry for ${version}."
            exit 1
          }

          # ORDER, not just presence. The check above asks only whether a
          # heading exists SOMEWHERE. fancy-flow's changelog had four sections
          # inserted ABOVE the [Unreleased] marker, so everything appended
          # since -- including 0.49.0 -- landed below them, and reading
          # top-down showed 0.48.1 as newest. That PASSED the presence check.
          #
          # A consumer deciding whether to upgrade reads top-down. Complete but
          # mis-ordered is a truthful-looking lie, and it is invisible to
          # whoever wrote it, because they are looking at their own entry
          # rather than at the file.
          first=$(grep -E '^## ' CHANGELOG.md \
            | grep -viE '^## +\[?unreleased\]?' \
            | head -1)

          if ! printf '%s' "$first" | grep -qE "^## +\[?v?${version}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${version}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${first}"
            echo "::error::Move this release above the older entries, then re-tag."
            exit 1
          fi

      # Release gate: third-party dependencies must be approved and still
      # maintained BEFORE the tarball reaches the registry. Once it is
      # published, an unapproved or abandoned dependency has already shipped
      # to everyone who upgrades -- the same reason the changelog gate sits
      # here. The allowlist is FETCHED, never vendored: one source of truth,
      # so there is no per-repo copy that can drift out of agreement with it.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - name: Require the version to match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" pyproject.toml || {
            echo "pyproject.toml version does not match tag ${GITHUB_REF_NAME}."
            exit 1
          }

      - run: python -m pip install --upgrade build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dists
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fancy-features
    permissions:
      id-token: write        # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dists
          path: dist/
      # Pinned by SHA, not by tag: a mutable reference in exactly this position
      # is what the April 2026 supply-chain compromises exploited.
      # v1.14.2 -- no `password:` (that is the point of Trusted Publishing) and
      # attestations default to true.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  # The GitHub release is its OWN job, deliberately the third one.
  #
  # This repo already splits `build` from `publish` so that `id-token: write`
  # is never held by the job executing package code. Adding `contents: write`
  # to either would undo that reasoning from the other side: in `build` it
  # hands repo-write to code that runs during the build, and in `publish` it
  # widens the single job holding the Trusted Publishing credential. So the
  # job that can write to the repo runs no build code and holds no token.
  #
  # Needed because every Python repo in this estate had ZERO GitHub releases
  # while the npm and PHP repos publish one per tag -- the same "a fix applied
  # only where the problem was noticed" gap, one ecosystem further along.
  #
  # Notes come from CHANGELOG.md so there is no second description to drift.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi

          # The section for this version, up to the next `## ` heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > notes.md

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Published release $GITHUB_REF_NAME."
